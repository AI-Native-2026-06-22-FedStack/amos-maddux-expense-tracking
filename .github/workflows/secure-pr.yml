name: Secure PR gate

# Runs on every pull request into the ExpenseFlow monorepo. Scanner jobs
# (SAST, SCA, secret scanning) and the OIDC proof job all run in parallel —
# none of them declare `needs:` on another, so GitHub schedules them
# concurrently rather than as one long sequential pipeline.
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

# Repository-default permissions are read-only. Any job that needs more
# (the OIDC job needs `id-token: write` to mint a federated token) declares
# its own `permissions:` block, scoped to only that job.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # SAST — matrixed per language leg so Node and Python run concurrently.
  # Each leg runs Semgrep (p/ci + p/owasp-top-ten + the custom ExpenseFlow
  # PII-in-logs rule under .semgrep/) plus the language-native linter
  # (eslint-plugin-security/no-secrets for node, Bandit for python).
  # ---------------------------------------------------------------------
  sast:
    name: SAST (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: node
            semgrep_target: apps/api apps/web packages lambda services/tivs-acl
          - language: python
            semgrep_target: services/compute
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python (for Semgrep)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Semgrep
        run: pip install semgrep

      - name: Validate custom Semgrep rules
        run: semgrep --validate --config .semgrep/

      - name: Run Semgrep (${{ matrix.language }})
        run: |
          mkdir -p artifacts/security
          semgrep scan \
            --config p/ci --config p/owasp-top-ten --config .semgrep/ \
            --severity ERROR \
            --sarif --output artifacts/security/semgrep-${{ matrix.language }}.sarif \
            ${{ matrix.semgrep_target }}

      - name: Set up Node
        if: matrix.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: matrix.language == 'node'
        run: npm ci

      - name: Run ESLint (security + no-secrets rules)
        if: matrix.language == 'node'
        run: |
          mkdir -p artifacts/security
          npx eslint . --format json --output-file artifacts/security/eslint-security.json

      - name: Set up uv (for Bandit)
        if: matrix.language == 'python'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: services/compute/uv.lock

      - name: Sync Python dependencies
        if: matrix.language == 'python'
        working-directory: services/compute
        run: uv sync --locked

      - name: Run Bandit
        if: matrix.language == 'python'
        working-directory: services/compute
        run: |
          mkdir -p ../../artifacts/security
          uv run bandit -r app -c pyproject.toml -f json -o ../../artifacts/security/bandit.json

      - name: Upload SAST results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-${{ matrix.language }}
          path: artifacts/security/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------
  # SCA — OSV-Scanner over every lockfile in the monorepo (npm + uv) in a
  # single pass; fails the job on any known-exploited HIGH/CRITICAL CVE.
  # ---------------------------------------------------------------------
  sca:
    name: SCA (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare SARIF evidence sink
        run: mkdir -p artifacts/security

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.0
        with:
          scan-args: |-
            --recursive
            --config=osv-scanner.toml
            --format=sarif
            --output-file=artifacts/security/osv-scanner.sarif
            ./

      - name: Upload SCA SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-osv-scanner
          path: artifacts/security/osv-scanner.sarif
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------
  # Secret scanning — language-agnostic, full git history (fetch-depth: 0)
  # so a secret committed and later deleted is still caught. A finding
  # only clears the gate via a recorded .gitleaksignore suppression with a
  # reason, never by the secret merely dropping out of the working tree.
  # ---------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (full history)
        run: |
          mkdir -p artifacts/security
          docker run --rm \
            -v "$(pwd):/repo" \
            zricethezav/gitleaks:v8.30.0 \
            detect --source=/repo --log-opts="--all" \
              --report-format=sarif \
              --report-path=/repo/artifacts/security/gitleaks.sarif \
              --exit-code=1

      - name: Upload secret-scan SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-gitleaks
          path: artifacts/security/gitleaks.sarif
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------
  # OIDC exchange proof — no long-lived AWS keys anywhere in this job or
  # the repo. `id-token: write` is what lets GitHub mint the short-lived
  # OIDC JWT that AWS STS exchanges for temporary credentials; without it
  # the exchange has nothing to fall back to and simply fails closed.
  #
  # The IAM role's trust policy restricts which repo/trigger can assume it
  # via the token's `sub` claim. For this job (trigger: pull_request) that
  # claim is:
  #
  #   repo:AI-Native-2026-06-22-FedStack/amos-maddux-expense-tracking:pull_request
  #
  # NOT a branch ref (":ref:refs/heads/...") — pull_request-triggered runs
  # do not carry a ref-based sub claim, and a trust policy written for
  # ":ref:refs/heads/main" will reject this job with an unhelpful
  # "Not authorized to perform sts:AssumeRoleWithWebIdentity". The example
  # trust policy condition is:
  #
  #   "StringEquals": {
  #     "token.actions.githubusercontent.com:sub":
  #       "repo:AI-Native-2026-06-22-FedStack/amos-maddux-expense-tracking:pull_request"
  #   }
  #
  # Current state: the OIDC provider
  # (arn:aws:iam::208096650110:oidc-provider/token.actions.githubusercontent.com)
  # exists in the target AWS account. The IAM role itself does not yet
  # exist — creating it requires iam:CreateRole, which the available IAM
  # identity does not have. Until the role is created and its ARN is set
  # as the AWS_ROLE_ARN repository variable, this job fails at the
  # configure-aws-credentials step with "Credentials could not be loaded"
  # (empty role-to-assume input), which is expected and does not indicate
  # a workflow bug. See docs/adr/0024-secure-pr-gate-matrix.md for the
  # full record.
  # ---------------------------------------------------------------------
  oidc-verify:
    name: AWS OIDC exchange
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Prove the exchange (assumed-role identity)
        run: aws sts get-caller-identity

  # ---------------------------------------------------------------------
  # Cosign keyless signing proof — builds the core-case-service image,
  # pushes it to GHCR under a PR-scoped tag, signs it keylessly via GitHub
  # OIDC (no stored key material), and verifies the signature back against
  # that same OIDC identity. `id-token: write` mints the short-lived OIDC
  # JWT Sigstore's Fulcio CA exchanges for the signing certificate;
  # `packages: write` is needed to push to GHCR from a pull_request-triggered
  # job. This duplicates the signing steps of release.yml (which only runs
  # on push to main) so the proof exists per-PR instead of only post-merge.
  # ---------------------------------------------------------------------
  cosign-verify:
    name: Cosign keyless signature proof
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_SLUG: core-case-service
      COSIGN_VERIFY_FILE: artifacts/security/cosign-verify-core-case-service.json
      VERIFY_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare evidence sink
        run: mkdir -p artifacts/security

      - name: Resolve image reference
        id: image
        run: |
          image_repository="$(printf 'ghcr.io/%s/%s' "${GITHUB_REPOSITORY}" "${IMAGE_SLUG}" | tr '[:upper:]' '[:lower:]')"
          image_ref="${image_repository}:pr-${{ github.event.pull_request.number }}-${GITHUB_SHA}"
          printf 'ref=%s\n' "${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        run: |
          docker push "${{ steps.image.outputs.ref }}"
          digest_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.image.outputs.ref }}")"
          printf 'digest-ref=%s\n' "${digest_ref}" >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Sign image keylessly
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ steps.push.outputs.digest-ref }}"

      - name: Verify keyless signature
        env:
          VERIFY_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/secure-pr.yml@refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          cosign verify \
            --certificate-oidc-issuer "${VERIFY_ISSUER}" \
            --certificate-identity "${VERIFY_IDENTITY}" \
            --output json \
            "${{ steps.push.outputs.digest-ref }}" > "${COSIGN_VERIFY_FILE}"

      - name: Check evidence file
        run: test -s "${COSIGN_VERIFY_FILE}"

      - name: Confirm no stored cosign key exists
        run: |
          if find . \
            -path ./.git -prune -o \
            -type f \( \
              -name 'cosign.key' -o \
              -name 'cosign.pub' -o \
              -name 'cosign.password' -o \
              -name '*cosign*key*' \
            \) -print | grep .; then
            echo "Stored cosign key material is not allowed; signing must stay keyless via GitHub OIDC."
            exit 1
          fi

      - name: Upload cosign verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosign-verify-core-case-service
          path: artifacts/security/cosign-verify-core-case-service.json
          if-no-files-found: error
          retention-days: 30
