name: PR checklist acknowledgement

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: PR checklist acknowledgement
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR checklist acknowledgement
        run: |
          node <<'NODE'
          const fs = require("fs");

          const eventPath = process.env.GITHUB_EVENT_PATH;
          if (!eventPath) {
            console.error("GITHUB_EVENT_PATH is not set; cannot read the pull_request event payload.");
            process.exit(1);
          }

          const event = JSON.parse(fs.readFileSync(eventPath, "utf8"));
          const body = event.pull_request?.body || "";
          const requiredItems = [
            "I confirm this PR links the relevant Jira ticket in the description.",
            "I confirm this PR covers one Jira ticket, or all related Jira tickets are linked and explained above.",
            "I confirm the source and target branches follow `CONTRIBUTING.md` rules: `feature/*` to `develop`, `release/*` to `develop` and `main`, or `hotfix/*` to `main` and `develop`.",
            "I confirm this PR is within 400 changed lines excluding lockfiles and generated files, or the exception is documented in the summary.",
            "I confirm required checks are expected to pass before merge.",
            "I confirm tenant-scoped records and access paths prevent cross-tenant read, write, inference, search, export, and delivery.",
            "I confirm all new or changed external inputs are validated at boundaries, and unsafe input is rejected or normalized.",
            "I confirm privileged actions and workflow state changes remain auditable without exposing controlled data.",
            "I confirm raw receipt data, payment data, bank-feed transaction data, secrets, credentials, tokens, and private identifiers are not logged in plaintext.",
            "I confirm architectural decision changes link the relevant ADR in the Related ADRs section, or the section states `N/A - no architectural decision changed`.",
          ];

          const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const unchecked = [];

          for (const item of requiredItems) {
            const checkedPattern = new RegExp(`^- \\[[xX]\\] ${escapeRegExp(item)}\\s*$`, "m");
            if (!checkedPattern.test(body)) {
              unchecked.push(item);
            }
          }

          const markdownSection = (name) => {
            const headingPattern = new RegExp(`^## ${escapeRegExp(name)}\\s*$`, "m");
            const heading = headingPattern.exec(body);
            if (!heading) {
              return "";
            }

            const rest = body.slice(heading.index + heading[0].length);
            const nextHeadingIndex = rest.search(/^## /m);
            return nextHeadingIndex === -1 ? rest : rest.slice(0, nextHeadingIndex);
          };

          const relatedAdrs = markdownSection("Related ADRs");
          const hasAdrLink = /docs\/adr\/[0-9]{4}[-a-z0-9]*\.md/i.test(relatedAdrs);
          const hasNoAdrStatement = /N\/A - no architectural decision changed/i.test(relatedAdrs);

          if (!hasAdrLink && !hasNoAdrStatement) {
            unchecked.push("Related ADRs must link docs/adr/... or state N/A - no architectural decision changed.");
          }

          if (unchecked.length > 0) {
            console.error("PR checklist acknowledgement failed. Complete these items before merge:");
            for (const item of unchecked) {
              console.error(`- ${item}`);
            }
            process.exit(1);
          }

          console.log("PR checklist acknowledgement passed.");
          NODE
