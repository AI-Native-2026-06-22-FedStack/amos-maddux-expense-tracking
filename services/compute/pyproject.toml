# path: services/compute/pyproject.toml
# Initialize with `uv init` then `uv add` the deps. PyJWT for verify, pwdlib for
# Argon2 hashing, httpx for any inter-service call, pytest for the contract test.
# NEVER add passlib (unmaintained, breaks at runtime on 3.13) or python-jose.
[project]
name = "compute"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "pyjwt[crypto]>=2.8",
  "pwdlib[argon2]",
  "httpx",
  "jsonschema",
  "psycopg[binary]",
  "structlog",
  "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pact-python>=3.4.0",
    "pytest",
    "ruff>=0.15.22",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.uv]
# Force the transitive `cryptography` pulled in by pyjwt[crypto] to a version
# with CVE-2026-69247 fixed (trivy HIGH gate). Not a direct dependency.
override-dependencies = ["cryptography>=50.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app"]
