# OSV-Scanner ignore list for ExpenseFlow. Every entry here must also have a
# row in docs/security/disposition-log.md explaining the accepted risk.
# HIGH/CRITICAL findings must be fixed, not ignored here.

[[IgnoredVulns]]
id = "GHSA-67mh-4wv8-2f99"
reason = """
esbuild <=0.24.2 dev-server CORS/websocket request-forwarding issue, CVSS 5.3 \
(MEDIUM), reachable only through a locally running esbuild dev server plus \
victim interaction. Pulled in transitively by drizzle-kit (a CLI migration \
tool, not a long-running dev server) via the deprecated @esbuild-kit/esm-loader. \
No newer stable drizzle-kit release avoids this dependency; the only fix \
available is an unstable 1.0.0-rc.x prerelease, which is a worse risk for a \
tool that runs real database migrations. Tracked in \
docs/security/disposition-log.md.
"""

[[IgnoredVulns]]
id = "GHSA-95ww-475f-pr4f"
reason = """
RAGAS SSRF via the multi-modal faithfulness collections module. ExpenseFlow's \
AI quality gate imports only text metrics (faithfulness, answer relevancy, and \
context precision) against synthetic policy-evaluation rows; it does not accept \
user-supplied multi-modal collections or run RAGAS in the production request \
path. OSV reports all available RAGAS releases through 0.4.3 as affected and no \
fixed PyPI release exists yet, so this is a temporary scanner suppression for \
offline CI evaluation tooling only. Tracked in docs/security/disposition-log.md.
"""

[[IgnoredVulns]]
id = "GHSA-w8v5-vhqr-4h9v"
reason = """
DiskCache unsafe pickle deserialization, pulled transitively by RAGAS for \
offline evaluation tooling. ExpenseFlow does not deserialize user-controlled \
DiskCache entries and does not use RAGAS in the production request path. OSV \
reports diskcache 5.6.3 as affected, and no PyPI release above 5.6.3 exists, so \
this is a temporary scanner suppression until a patched release is available or \
RAGAS removes the dependency. Tracked in docs/security/disposition-log.md.
"""
